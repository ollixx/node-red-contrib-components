name: Publish to NPM

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.3.4
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Require supported release tag format
        run: |
          case "$RELEASE_TAG" in
            v*.*.*-rc.*) ;;
            v*.*.*) ;;
            *)
              echo "Publish workflow expects a stable tag like v0.4.0 or an RC tag like v0.4.0-rc.1. Received: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
      - run: npm ci
      - run: node scripts/validate-release-version.js
      - run: npm test
      - run: npm run test:coverage
      - run: npm run pack:check
      - run: npm --prefix ./components/uitest/ install
      - run: npx --prefix ./components/uitest playwright install --with-deps chromium
      - run: npm run uitest

  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Require supported release tag format
        run: |
          case "$RELEASE_TAG" in
            v*.*.*-rc.*) ;;
            v*.*.*) ;;
            *)
              echo "Publish workflow expects a stable tag like v0.4.0 or an RC tag like v0.4.0-rc.1. Received: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
      - run: npm ci
      - run: node scripts/validate-release-version.js
      - run: npm run pack:check
      - name: Publish package
        run: |
          case "$RELEASE_TAG" in
            v*.*.*-rc.*)
              npm publish --tag next
              ;;
            v*.*.*)
              npm publish
              ;;
          esac
      - name: Create GitHub prerelease
        if: ${{ contains(env.RELEASE_TAG, '-rc.') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: true